name: Sync EPUBs to Scriptorium WebDAV

on:
  workflow_call:
    inputs:
      epub_globs:
        description: "Space-separated EPUB globs in the caller repository"
        required: false
        type: string
        default: "output/epub/*.epub"
      epub_build_command:
        description: "Optional shell command, run in the caller repository, that builds EPUB artifacts before sync"
        required: false
        type: string
        default: ""
      remote_prefix:
        description: "Remote WebDAV prefix"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Print uploads without PUT"
        required: false
        type: boolean
        default: false
      flatten:
        description: "Upload all EPUBs directly under the remote prefix"
        required: false
        type: boolean
        default: false
      mirror:
        description: "Delete remote EPUBs under the prefix that are not matched locally"
        required: false
        type: boolean
        default: false
      allow_empty:
        description: "Exit successfully when no EPUBs match"
        required: false
        type: boolean
        default: false
      run_smoke:
        description: "Run WebDAV/OPDS smoke checks after live sync"
        required: false
        type: boolean
        default: false
      smoke_expected_folders:
        description: "Optional newline-separated root folders required by the smoke verifier"
        required: false
        type: string
        default: ""
      smoke_required_opds_entries:
        description: "Optional newline-separated OPDS title or href substrings required by the smoke verifier"
        required: false
        type: string
        default: ""
    secrets:
      READEST_WEBDAV_URL:
        required: true
      READEST_WEBDAV_USERNAME:
        required: true
      READEST_WEBDAV_PASSWORD:
        required: true
      SOURCE_REPO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      epub_globs:
        description: "Space-separated EPUB globs"
        required: false
        default: "output/epub/*.epub"
      epub_build_command:
        description: "Optional shell command, run in the caller repository, that builds EPUB artifacts before sync"
        required: false
        default: ""
      remote_prefix:
        description: "Remote WebDAV prefix"
        required: false
        default: ""
      dry_run:
        description: "Print uploads without PUT"
        required: false
        type: boolean
        default: true
      flatten:
        description: "Upload all EPUBs directly under the remote prefix"
        required: false
        type: boolean
        default: false
      mirror:
        description: "Delete remote EPUBs under the prefix that are not matched locally"
        required: false
        type: boolean
        default: false
      allow_empty:
        description: "Exit successfully when no EPUBs match"
        required: false
        type: boolean
        default: false
      run_smoke:
        description: "Run WebDAV/OPDS smoke checks after live sync"
        required: false
        type: boolean
        default: false
      smoke_expected_folders:
        description: "Optional newline-separated root folders required by the smoke verifier"
        required: false
        default: ""
      smoke_required_opds_entries:
        description: "Optional newline-separated OPDS title or href substrings required by the smoke verifier"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: caller

      - name: Checkout Scriptorium automation
        uses: actions/checkout@v4
        with:
          repository: CastaliaInstitute/scriptorium
          ref: main
          path: scriptorium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        if: ${{ inputs.run_smoke && inputs.dry_run == false }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build EPUB artifacts
        if: ${{ inputs.epub_build_command != '' }}
        working-directory: caller
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: ${{ inputs.epub_build_command }}

      - name: Sync EPUBs
        env:
          WEBDAV_URL: ${{ secrets.READEST_WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.READEST_WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.READEST_WEBDAV_PASSWORD }}
        run: |
          set -euo pipefail
          read -r -a args <<< "${{ inputs.epub_globs }}"
          dry_run=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            dry_run+=(--dry-run)
          fi
          flatten=()
          if [ "${{ inputs.flatten }}" = "true" ]; then
            flatten+=(--flatten)
          fi
          mirror=()
          if [ "${{ inputs.mirror }}" = "true" ]; then
            mirror+=(--mirror)
          fi
          allow_empty=()
          if [ "${{ inputs.allow_empty }}" = "true" ]; then
            allow_empty+=(--allow-empty)
          fi
          cd caller
          python3 ../scriptorium/tools/readest-revision-sync/scripts/sync_epubs_to_webdav.py \
            --remote-prefix "${{ inputs.remote_prefix }}" \
            "${dry_run[@]}" \
            "${flatten[@]}" \
            "${mirror[@]}" \
            "${allow_empty[@]}" \
            "${args[@]}"

      - name: Smoke test WebDAV and OPDS after sync
        if: ${{ inputs.run_smoke && inputs.dry_run == false }}
        working-directory: scriptorium/tools/readest-webdav-cloudrun
        env:
          READEST_WEBDAV_URL: ${{ secrets.READEST_WEBDAV_URL }}
          READEST_WEBDAV_USERNAME: ${{ secrets.READEST_WEBDAV_USERNAME }}
          READEST_WEBDAV_PASSWORD: ${{ secrets.READEST_WEBDAV_PASSWORD }}
          SMOKE_EXPECTED_FOLDERS: ${{ inputs.smoke_expected_folders }}
          SMOKE_REQUIRED_OPDS_ENTRIES: ${{ inputs.smoke_required_opds_entries }}
        run: |
          set -euo pipefail
          npm ci
          smoke_args=()
          while IFS= read -r folder; do
            [ -n "$folder" ] || continue
            smoke_args+=(--expect-folder "$folder")
          done <<< "$SMOKE_EXPECTED_FOLDERS"
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            smoke_args+=(--require-opds-entry "$entry")
          done <<< "$SMOKE_REQUIRED_OPDS_ENTRIES"
          node scripts/smoke_webdav_opds.mjs "${smoke_args[@]}"

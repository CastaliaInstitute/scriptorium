name: Readest Comments to Issues

on:
  workflow_call:
    inputs:
      readest_remote_root:
        description: "Remote WebDAV root to scan for Readest exports"
        required: false
        type: string
        default: ""
      source_map:
        description: "JSONL source map in the caller repository"
        required: false
        type: string
        default: "output/rag/rag-ingest-manifest.jsonl"
      source_map_build_command:
        description: "Optional shell command, run in the caller repository, that builds the source map before ingest"
        required: false
        type: string
        default: ""
      work_slug:
        description: "Optional canonical work slug filter"
        required: false
        type: string
        default: ""
      issue_limit:
        description: "Maximum issues to create per run"
        required: false
        type: number
        default: 20
      generate_edit_proposals:
        description: "Generate source-edit proposal artifacts from mapped annotations"
        required: false
        type: boolean
        default: false
      edit_proposals_use_ai:
        description: "Use Gemini for source-edit proposals instead of manual-review prompts"
        required: false
        type: boolean
        default: false
      edit_proposal_limit:
        description: "Maximum edit proposals to generate; 0 means all mapped annotations"
        required: false
        type: number
        default: 0
      dry_run:
        description: "Print issue payloads without creating GitHub issues"
        required: false
        type: boolean
        default: false
    secrets:
      READEST_WEBDAV_URL:
        required: true
      READEST_WEBDAV_USERNAME:
        required: true
      READEST_WEBDAV_PASSWORD:
        required: true
      GEMINI_API_KEY:
        required: false
      SOURCE_REPO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      readest_remote_root:
        description: "Remote WebDAV root to scan for Readest exports"
        required: false
        default: ""
      source_map:
        description: "JSONL source map"
        required: false
        default: "output/rag/rag-ingest-manifest.jsonl"
      source_map_build_command:
        description: "Optional shell command, run in the caller repository, that builds the source map before ingest"
        required: false
        default: ""
      work_slug:
        description: "Optional canonical work slug filter"
        required: false
        default: ""
      issue_limit:
        description: "Maximum issues to create"
        required: false
        default: "20"
      generate_edit_proposals:
        description: "Generate source-edit proposal artifacts from mapped annotations"
        required: false
        type: boolean
        default: false
      edit_proposals_use_ai:
        description: "Use Gemini for source-edit proposals instead of manual-review prompts"
        required: false
        type: boolean
        default: false
      edit_proposal_limit:
        description: "Maximum edit proposals to generate; 0 means all mapped annotations"
        required: false
        default: "0"
      dry_run:
        description: "Print issue payloads without creating GitHub issues"
        required: false
        type: boolean
        default: true

jobs:
  issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: caller

      - name: Checkout Scriptorium automation
        uses: actions/checkout@v4
        with:
          repository: CastaliaInstitute/scriptorium
          ref: main
          path: scriptorium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source map
        if: ${{ inputs.source_map_build_command != '' }}
        working-directory: caller
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
        run: ${{ inputs.source_map_build_command }}

      - name: Download Readest annotation exports
        env:
          WEBDAV_URL: ${{ secrets.READEST_WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.READEST_WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.READEST_WEBDAV_PASSWORD }}
        run: |
          set -euo pipefail
          cd caller
          python3 ../scriptorium/tools/readest-revision-sync/scripts/download_readest_webdav_json.py \
            --remote-root "${{ inputs.readest_remote_root }}" \
            --out-dir output/readest/webdav

      - name: Map annotations to source context
        run: |
          set -euo pipefail
          cd caller
          work_slug_args=()
          if [ -n "${{ inputs.work_slug }}" ]; then
            work_slug_args+=(--work-slug "${{ inputs.work_slug }}")
          fi
          python3 ../scriptorium/tools/readest-revision-sync/scripts/ingest_readest_annotations.py \
            output/readest/webdav \
            --source-map "${{ inputs.source_map }}" \
            --out-dir output/readest \
            --packet-dir .atelier/readest-review \
            "${work_slug_args[@]}"

      - name: Generate source edit proposals
        if: ${{ inputs.generate_edit_proposals }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_READEST_EDIT_MODEL: ${{ vars.GEMINI_READEST_EDIT_MODEL || 'gemini-3.5-flash' }}
        working-directory: caller
        run: |
          set -euo pipefail
          ai_args=(--no-ai)
          if [ "${{ inputs.edit_proposals_use_ai }}" = "true" ]; then
            ai_args=()
          fi
          limit_args=()
          if [ "${{ inputs.edit_proposal_limit }}" != "0" ]; then
            limit_args+=(--limit "${{ inputs.edit_proposal_limit }}")
          fi
          python3 ../scriptorium/tools/readest-revision-sync/scripts/propose_readest_source_edits.py \
            --input output/readest/readest-annotations.mapped.jsonl \
            --workspace-root .. \
            --out-dir .atelier/readest-edit-proposals \
            "${ai_args[@]}" \
            "${limit_args[@]}"

      - name: Generate cross-reference endnotes
        working-directory: caller
        run: |
          set -euo pipefail
          python3 ../scriptorium/tools/readest-revision-sync/scripts/generate_cross_reference_notes.py \
            --input output/readest/readest-annotations.mapped.jsonl \
            --out-dir .atelier/readest-cross-reference-notes

      - name: Upload cross-reference endnotes
        uses: actions/upload-artifact@v4
        with:
          name: readest-cross-reference-endnotes
          path: caller/.atelier/readest-cross-reference-notes
          if-no-files-found: warn

      - name: Upload source edit proposals
        if: ${{ inputs.generate_edit_proposals }}
        uses: actions/upload-artifact@v4
        with:
          name: readest-edit-proposals
          path: caller/.atelier/readest-edit-proposals
          if-no-files-found: warn

      - name: Create GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_READEST_ISSUE_MODEL || 'gemini-3.5-flash' }}
          READEST_ISSUE_LIMIT: ${{ inputs.issue_limit }}
        working-directory: caller
        run: |
          set -euo pipefail
          dry_run=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            dry_run+=(--dry-run)
          fi
          python3 ../scriptorium/tools/readest-revision-sync/scripts/create_readest_review_issues.py "${dry_run[@]}"

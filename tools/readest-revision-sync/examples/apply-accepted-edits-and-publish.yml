name: Apply Accepted Readest Edits

on:
  workflow_dispatch:
    inputs:
      proposal_artifact_path:
        description: "Path to readest-source-edit-proposals.jsonl in this repository"
        required: false
        default: ".atelier/readest-edit-proposals/readest-source-edit-proposals.jsonl"
      accepted_keys:
        description: "Whitespace-separated accepted proposal keys"
        required: true
      branch:
        description: "Branch to create for the accepted source edits"
        required: false
        default: "codex/apply-readest-edits"

jobs:
  apply:
    uses: CastaliaInstitute/scriptorium/.github/workflows/apply-accepted-readest-edits.yml@main
    permissions:
      actions: read
      contents: write
      pull-requests: write
    with:
      proposal_artifact_path: ${{ inputs.proposal_artifact_path }}
      accepted_keys: ${{ inputs.accepted_keys }}
      branch: ${{ inputs.branch }}

